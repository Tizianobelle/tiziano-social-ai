<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiziano Personal AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:980px;margin:auto;padding:24px}header{background:#0b2d5c;color:white;padding:22px;border-radius:18px;margin-bottom:18px}nav{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.btn{background:#e8eef8}.primary{background:#0b2d5c;color:white}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #00000010}textarea,input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd5e2;border-radius:10px;margin:7px 0 12px}pre{white-space:pre-wrap;background:#f6f8fb;padding:12px;border-radius:10px}.hidden{display:none}.tag{font-size:12px;background:#e8eef8;padding:5px 8px;border-radius:99px}</style></head><body><div class="wrap"><header><h1>Tiziano Personal AI</h1><p>Strategia • Interviste • Allenamento • Simulazioni • Knowledge • Social AI</p><span class="tag">V1 Web</span></header><div id="login" class="card"><h2>Accedi</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="login()">Accedi</button><p id="loginMsg"></p></div><main id="app" class="hidden"><nav><button onclick="show('ask')">Chiedi</button><button onclick="show('interview')">Intervistami</button><button onclick="show('training')">Allenami</button><button onclick="show('simulation')">Simula</button><button onclick="show('knowledge')">Conoscenze</button><button onclick="show('ideas')">Idee</button><button onclick="logout()">Esci</button></nav><section id="ask" class="card pane"><h2>Chiedi a Tiziano Personal AI</h2><textarea id="askText" rows="5" placeholder="Scrivi cosa vuoi fare..."></textarea><button class="primary" onclick="gateway()">Analizza richiesta</button><pre id="askOut"></pre></section><section id="interview" class="card pane hidden"><h2>Intervistami</h2><select id="imode"><option value="free">Libero</option><option value="rapid">Rapido</option><option value="deep">Deep</option><option value="pastor">PASTOR</option><option value="hero">Eroe</option><option value="hybrid">Ibrido</option></select><textarea id="ictx" rows="4" placeholder="Contesto o tema"></textarea><button class="primary" onclick="startInterview(false)">Inizia</button><pre id="iout"></pre></section><section id="training" class="card pane hidden"><h2>Allenami</h2><textarea id="tctx" rows="4" placeholder="Su cosa vuoi allenarti?"></textarea><select id="tdiff"><option value="adaptive">Adattiva</option><option value="easy">Facile</option><option value="medium">Media</option><option value="hard">Difficile</option></select><button class="primary" onclick="startInterview(true)">Inizia allenamento</button><pre id="tout"></pre></section><section id="simulation" class="card pane hidden"><h2>Simula</h2><input id="stype" placeholder="Scenario, es. persona scettica"><input id="persona" placeholder="Interlocutore"><textarea id="sobj" rows="3" placeholder="Obiettivo"></textarea><button class="primary" onclick="startSim()">Avvia simulazione</button><pre id="sout"></pre></section><section id="knowledge" class="card pane hidden"><h2>Le mie conoscenze</h2><button class="primary" onclick="loadKnowledge()">Aggiorna</button><pre id="kout"></pre></section><section id="ideas" class="card pane hidden"><h2>Idee</h2><button class="primary" onclick="loadIdeas()">Aggiorna</button><pre id="ideasOut"></pre></section></main></div><script>
const URL='https://mdskugnrrdamzlplupmi.supabase.co';const KEY='REPLACE_WITH_EXISTING_PUBLISHABLE_KEY';const sb=supabase.createClient(URL,KEY);
async function session(){return (await sb.auth.getSession()).data.session}async function login(){let{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});loginMsg.textContent=error?error.message:'';if(!error)boot()}async function logout(){await sb.auth.signOut();location.reload()}async function boot(){let s=await session();login.classList.toggle('hidden',!!s);app.classList.toggle('hidden',!s)}function show(id){document.querySelectorAll('.pane').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}async function call(fn,body){let s=await session();let r=await fetch(URL+'/functions/v1/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+s.access_token},body:JSON.stringify(body)});return await r.json()}async function gateway(){askOut.textContent=JSON.stringify(await call('tiziano-personal-ai-gateway',{message:askText.value}),null,2)}async function startInterview(training){let ctx=training?tctx.value:ictx.value,mode=training?'training':imode.value,out=training?tout:iout;out.textContent=JSON.stringify(await call('tiziano-content-strategist',{action:'start_interview',mode,context:ctx,objective:ctx,difficulty:training?tdiff.value:'adaptive'}),null,2)}async function startSim(){sout.textContent=JSON.stringify(await call('tiziano-training-simulator',{action:'start',scenario_type:stype.value,persona_name:persona.value||'Interlocutore',objective:sobj.value,difficulty:'adaptive'}),null,2)}async function loadKnowledge(){kout.textContent=JSON.stringify(await call('tiziano-content-strategist',{action:'get_knowledge',limit:50}),null,2)}async function loadIdeas(){ideasOut.textContent=JSON.stringify(await call('tiziano-content-strategist',{action:'list_ideas'}),null,2)}boot();
</script></body></html>
